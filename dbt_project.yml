name: 'der_sp'
version: '1.0.0'
config-version: 2

profile: 'der_sp'  # deve bater exatamente com o profiles.yml

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets: ["target", "dbt_packages"]

seeds:
  der_sp:
    +file_format: parquet
    +delimiter: "\t"

models:
  der_sp:
    # Materialization is declared per model, in each model's own config() block.
    # Staging, dimensions and core each mix tables and incrementals, so no
    # layer-wide default would be true for them. Marts are the exception: all
    # three are tables, so the default here is accurate.
    staging:
      +schema: staging
    dimensions:
      +schema: dim
    core:
      +schema: core
    marts:
      +materialized: table
      +schema: marts
